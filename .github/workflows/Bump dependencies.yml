name: Bump dependencies
on: workflow_dispatch

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: gradle
      - name: Apply bumps
        run: |
          sed -i 's/^guava = .*/guava = "33.7.2-jre"/' gradle/libs.versions.toml
          sed -i 's/^bouncycastle = .*/bouncycastle = "1.86"/' gradle/libs.versions.toml
          sed -i 's/^core-ktx = .*/core-ktx = "1.19.1"/' gradle/libs.versions.toml
          sed -i 's/^kotlin = .*/kotlin = "2.4.21"/' gradle/libs.versions.toml
      - name: Write verification metadata
        run: ./gradlew --write-verification-metadata sha256 assembleDebug lintDebug testDebugUnitTest -DskipFormatKtlint
      - name: Push branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b deps-bump
          git add gradle/libs.versions.toml gradle/verification-metadata.xml
          git commit -m "chore: bump dependencies and update verification metadata"
          git push -f origin deps-bump
